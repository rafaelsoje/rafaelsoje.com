    <line x1="20" y1="130" x2="904" y2="130" stroke="#1e293b" stroke-width="1" />
    <text x="35" y="118" fill="#2dd4bf" font-family="monospace" font-size="11">EVT-2026-041</text>
    <text x="140" y="118" fill="#f8fafc" font-family="sans-serif" font-size="12">Convenção Empresarial</text>
    <text x="360" y="118" fill="#94a3b8" font-family="sans-serif" font-size="12">Empresa Exemplo Alfa</text>
    <text x="560" y="118" fill="#cbd5e1" font-family="monospace" font-size="11">24/10/2026</text>
    <rect x="685" y="105" width="88" height="20" rx="4" fill="#065f46" fill-opacity="0.4" stroke="#059669" stroke-width="0.8" />
