    <text x="35" y="83" fill="#64748b" font-family="monospace" font-size="10">CÓDIGO</text>
    <text x="140" y="83" fill="#64748b" font-family="monospace" font-size="10">TIPO DE EVENTO</text>
    <text x="360" y="83" fill="#64748b" font-family="monospace" font-size="10">CLIENTE (DEMO)</text>
