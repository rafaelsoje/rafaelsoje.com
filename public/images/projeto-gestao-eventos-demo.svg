    <text x="252" y="24" fill="#64748b" font-family="monospace" font-size="10">PROPOSTAS ABERTAS</text>
    <text x="252" y="58" fill="#f8fafc" font-family="sans-serif" font-size="28" font-weight="bold">12</text>
    <text x="252" y="80" fill="#38bdf8" font-family="monospace" font-size="11">R$ 142.500 (em negociação)</text>

    <!-- KPI 3 -->
