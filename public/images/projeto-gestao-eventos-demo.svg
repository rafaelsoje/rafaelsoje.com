<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1324" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="chartLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Left Sidebar -->
  <rect x="0" y="0" width="220" height="800" fill="#090d16" stroke="#1e293b" stroke-width="1" />
  
  <!-- Sidebar Monogram / Logo -->
  <rect x="24" y="24" width="36" height="36" rx="6" fill="#0f172a" stroke="#0d9488" stroke-width="1.5" />
  <text x="33" y="47" fill="#14b8a6" font-family="monospace" font-size="16" font-weight="bold">rs.</text>
  <text x="70" y="42" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">SIGES EVENTOS</text>
  <text x="70" y="55" fill="#64748b" font-family="monospace" font-size="10">PAINEL DE GESTÃO</text>

  <!-- Sidebar Nav Items -->
  <g transform="translate(20, 95)">
    <!-- Active Item -->
    <rect x="0" y="0" width="180" height="36" rx="6" fill="#0d9488" fill-opacity="0.15" stroke="#0d9488" stroke-opacity="0.3" />
    <rect x="0" y="6" width="3" height="24" rx="1.5" fill="#14b8a6" />
    <text x="16" y="23" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">Visão Geral / Dashboard</text>

    <!-- Other items -->
    <text x="16" y="65" fill="#94a3b8" font-family="sans-serif" font-size="12">Propostas Comerciais</text>
    <text x="16" y="105" fill="#94a3b8" font-family="sans-serif" font-size="12">Agenda &amp; Calendário</text>
    <text x="16" y="145" fill="#94a3b8" font-family="sans-serif" font-size="12">Ordens de Serviço</text>
    <text x="16" y="185" fill="#94a3b8" font-family="sans-serif" font-size="12">Equipes &amp; Escalas</text>
    <text x="16" y="225" fill="#94a3b8" font-family="sans-serif" font-size="12">Controle Financeiro</text>
    <text x="16" y="265" fill="#94a3b8" font-family="sans-serif" font-size="12">Relatórios Operacionais</text>
  </g>

  <!-- System Version Footer in Sidebar -->
  <rect x="20" y="730" width="180" height="42" rx="6" fill="#0f172a" stroke="#1e293b" />
  <text x="32" y="748" fill="#64748b" font-family="monospace" font-size="10">STATUS // OPERACIONAL</text>
  <text x="32" y="762" fill="#10b981" font-family="monospace" font-size="10">● AMBIENTE ESTÁVEL</text>

  <!-- Main Top Bar -->
