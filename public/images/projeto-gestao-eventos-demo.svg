    <text x="16" y="24" fill="#64748b" font-family="monospace" font-size="10">EVENTOS ATIVOS</text>
    <text x="16" y="58" fill="#f8fafc" font-family="sans-serif" font-size="28" font-weight="bold">24</text>
    <text x="16" y="80" fill="#10b981" font-family="monospace" font-size="11">↑ 100% no cronograma</text>

    <!-- KPI 2 -->
