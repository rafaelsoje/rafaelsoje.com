    <text x="235" y="248" fill="#64748b" font-family="monospace" font-size="10">MAR</text>
    <text x="330" y="248" fill="#64748b" font-family="monospace" font-size="10">ABR</text>
    <text x="430" y="248" fill="#64748b" font-family="monospace" font-size="10">MAI</text>
