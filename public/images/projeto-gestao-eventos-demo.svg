    <line x1="20" y1="175" x2="904" y2="175" stroke="#1e293b" stroke-width="1" />
    <text x="35" y="163" fill="#2dd4bf" font-family="monospace" font-size="11">EVT-2026-042</text>
    <text x="140" y="163" fill="#f8fafc" font-family="sans-serif" font-size="12">Workshop de Inovação</text>
    <text x="360" y="163" fill="#94a3b8" font-family="sans-serif" font-size="12">Grupo Beta Soluções</text>
    <text x="560" y="163" fill="#cbd5e1" font-family="monospace" font-size="11">28/10/2026</text>
    <rect x="685" y="150" width="88" height="20" rx="4" fill="#075985" fill-opacity="0.4" stroke="#0284c7" stroke-width="0.8" />
    <text x="698" y="163" fill="#38bdf8" font-family="monospace" font-size="10">EM EXECUÇÃO</text>
    <text x="820" y="163" fill="#38bdf8" font-family="monospace" font-size="11">Ver detalhes →</text>

    <!-- Row 3 -->
    <line x1="20" y1="220" x2="904" y2="220" stroke="#1e293b" stroke-width="1" />
    <text x="35" y="208" fill="#2dd4bf" font-family="monospace" font-size="11">EVT-2026-043</text>
    <text x="140" y="208" fill="#f8fafc" font-family="sans-serif" font-size="12">Encontro Anual de Líderes</text>
    <text x="360" y="208" fill="#94a3b8" font-family="sans-serif" font-size="12">Associação Delta</text>
    <text x="560" y="208" fill="#cbd5e1" font-family="monospace" font-size="11">04/11/2026</text>
    <rect x="685" y="195" width="88" height="20" rx="4" fill="#854d0e" fill-opacity="0.4" stroke="#ca8a04" stroke-width="0.8" />
    <text x="702" y="208" fill="#facc15" font-family="monospace" font-size="10">PROPOSTA</text>
    <text x="820" y="208" fill="#38bdf8" font-family="monospace" font-size="11">Ver detalhes →</text>

    <!-- Row 4 -->
    <text x="35" y="253" fill="#2dd4bf" font-family="monospace" font-size="11">EVT-2026-044</text>
    <text x="140" y="253" fill="#f8fafc" font-family="sans-serif" font-size="12">Seminário de Tecnologia</text>
    <text x="360" y="253" fill="#94a3b8" font-family="sans-serif" font-size="12">Consultoria Gamma</text>
    <text x="560" y="253" fill="#cbd5e1" font-family="monospace" font-size="11">12/11/2026</text>
    <rect x="685" y="240" width="88" height="20" rx="4" fill="#065f46" fill-opacity="0.4" stroke="#059669" stroke-width="0.8" />
    <text x="698" y="253" fill="#34d399" font-family="monospace" font-size="10">CONFIRMADO</text>
    <text x="820" y="253" fill="#38bdf8" font-family="monospace" font-size="11">Ver detalhes →</text>
