  <text x="248" y="38" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">Gestão Operacional de Eventos</text>
  <text x="510" y="38" fill="#64748b" font-family="monospace" font-size="11">DADOS DEMONSTRATIVOS FICTÍCIOS</text>
  
  <rect x="1020" y="18" width="150" height="28" rx="4" fill="#1e293b" stroke="#334155" />
  <circle cx="1036" cy="32" r="4" fill="#10b981" />
  <text x="1048" y="36" fill="#94a3b8" font-family="monospace" font-size="10">FILTRO: 30 DIAS</text>

